name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run graph and dataset tests
        run: python -m unittest discover -s tests -v
      - name: Run the analysis
        run: python start.py
      - name: Install plotting dependencies
        run: python -m pip install -r requirements-report.txt
      - name: Build the report from committed data
        run: python make_report.py --output-dir "${{ runner.temp }}/scotus-report"
      - name: Build the case explorer
        run: python scripts/build_explorer.py --output-dir "${{ runner.temp }}/scotus-explorer"
