name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  analysis-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run graph and dataset tests
        run: python -m unittest discover -s tests -v
      - name: Run the analysis
        run: python start.py
      - name: Build the opinion-level comparison
        run: python compare_terms.py --output-dir "${{ runner.temp }}/scotus-opinion-comparison"
      - name: Install plotting dependencies
        run: python -m pip install -r requirements-report.txt
      - name: Build the report from committed data
        run: python make_report.py --output-dir "${{ runner.temp }}/scotus-report"
      - name: Build the case explorer
        run: python scripts/build_explorer.py --output-dir "${{ runner.temp }}/scotus-explorer" --report-path "${{ runner.temp }}/scotus-report/citation_age_report.html"
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/initial-release'
        uses: actions/configure-pages@v5
      - name: Upload the website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/initial-release'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/scotus-explorer

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/initial-release'
    needs: analysis-and-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
